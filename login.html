<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProScouter — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --red:#C8202F; --green:#1E5631; --bg:#F6F5EF; --ink:#1B1B16; --muted:#726F63; --border:#E2DFD2; }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
       background:var(--bg); font-family:'Inter',sans-serif; color:var(--ink);}
  .card{background:#fff; border:1px solid var(--border); border-radius:14px; padding:36px 34px; width:100%; max-width:360px;}
  .mark{width:44px; height:48px; margin-bottom:14px;}
  h1{font-family:'Space Grotesk',sans-serif; font-size:21px; margin:0 0 2px;}
  h1 .pro{color:var(--red);} h1 .scouter{color:var(--green);}
  p.sub{font-size:13px; color:var(--muted); margin:0 0 22px;}
  label{display:block; font-size:12.5px; font-weight:600; margin-bottom:6px;}
  input{width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px;}
  input:focus{outline:2px solid var(--green); outline-offset:1px;}
  button{width:100%; margin-top:16px; background:var(--green); color:#fff; border:none; border-radius:8px;
         padding:11px; font-weight:600; font-size:14px; cursor:pointer; font-family:'Space Grotesk',sans-serif;}
  button:hover{background:#123A20;}
  .error{color:var(--red); font-size:13px; margin-top:10px; display:none;}
</style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 10 L95 10 C112 10 112 62 95 62 L45 62 L45 120 L10 90 Z" fill="#C8202F"/>
      <path d="M10 10 L10 90 L45 120 L45 62 L10 10 Z" fill="#1E5631"/>
      <circle cx="55" cy="45" r="26" fill="#fff"/>
      <circle cx="55" cy="45" r="21" fill="none" stroke="#1E5631" stroke-width="4"/>
      <rect x="40" y="35" width="30" height="20" rx="2" fill="#1E5631"/>
      <path d="M41 36 L55 47 L69 36" stroke="#fff" stroke-width="2.5" fill="none"/>
    </svg>
    <h1><span class="pro">Pro</span><span class="scouter">Scouter</span></h1>
    <p class="sub">Enter the password to open your dashboard.</p>
    <form id="loginForm">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
      <button type="submit">Sign in</button>
      <div class="error" id="error">Wrong password. Try again.</div>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      errorEl.style.display = 'none';
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (data.ok) {
          window.location.href = '/';
        } else {
          errorEl.textContent = data.error || 'Wrong password. Try again.';
          errorEl.style.display = 'block';
        }
      } catch (e) {
        errorEl.textContent = 'Could not reach the server.';
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
